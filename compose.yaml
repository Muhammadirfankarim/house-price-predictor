services:
  fastapi:
    image: fastapi:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  streamlit:
    image: streamlit:v1
    build:
      context: ./streamlit_app
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    command: streamlit run app.py --server.port 8501
    environment:
      - API_URL=http://fastapi:8000
